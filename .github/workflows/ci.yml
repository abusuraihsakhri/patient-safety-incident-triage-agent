name: Test Python and browser demo

on:
  push:
    branches: [ master, main, "audit/**" ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Python compilation
        run: python -m compileall -q agents patient_safety_incident_triage_agent cli.py safety_incident.py
      - name: Python tests
        run: python -m pytest -q
      - name: Browser script checks and rule tests
        run: |
          node --check web/app.mjs
          node --test web/app.test.mjs
