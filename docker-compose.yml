services:
  patient-safety-incident-triage-engine:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a private audit HMAC key}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?Set a private API access key}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
