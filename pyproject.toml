[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-safety-incident-triage-engine"
version = "2.0.0"
description = "Illustrative deterministic incident evaluation tools; not clinically validated"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
patient-safety-incident-triage-engine = "patient_safety_incident_triage_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/patient-safety-incident-triage-agent"
Repository = "https://github.com/abusuraihsakhri/patient-safety-incident-triage-agent.git"

[tool.setuptools]
py-modules = ["cli", "safety_incident", "enrichment", "simulator", "patient_safety_incident_triage_agent_app", "safety_incident_app"]

[tool.setuptools.packages.find]
include = ["agents*", "patient_safety_incident_triage_agent*"]
